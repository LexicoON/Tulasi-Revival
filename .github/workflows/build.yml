          "mother-qvidcap.png:qvidcap.png:org.v4l2.qvidcap.png:Qvidcap.png"
          "mother-qwery.addwater.png:io.github.qwery.addwater.png:addwater.png:AddWater.png:io.github.qwery.AddWater.png"
