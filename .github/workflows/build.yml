          "mother-renderdoc.png:renderdoc.png:org.renderdoc.RenderDoc.png:qrenderdoc.png:RenderDoc.png"
          "mother-scheduleext.png:scx-manager.png:scx_manager.png:Scx-manager.png:Scx_manager.png:scx.png:schedextgui.png:org.cachyos.scx-manager"
          "mother-shelly.png:shelly.png:shellyalpm.png:Shelly.png"
          "mother-shiftey.desktop.png:io.github.shiftey.Desktop.png:github-desktop.png:GitHubDesktop.png"
          "mother-signal.png:signal-desktop.png:org.signal.Signal.png:Signal.png:signal_signal.png:appimagekit-signal-desktop.png"
          "mother-spotify.png:spotify.png:com.spotify.Client.png:spotify-client.png:Spotify.png"
          "mother-steam.svg.png:steam.png:com.valvesoftware.Steam.png:net.valvesoftware.Steam.png:Steam.png:steam-icon.png:steam_icon_480.png"
          "mother-sublime_merge.png:sublime-merge.png:com.sublimemerge.App.png:Sublime_merge.png:sublime_merge.png"
          "mother-systemmonitor.png:org.kde.plasma-systemmonitor.png:plasma-systemmonitor.png:Plasma-systemmonitor.png:ksysguard.png:org.kde.ksysguard.png:Ksysguard.png:utilities-system-monitor.png:system-monitor.png"
          "mother-system-software-install.svg.png:system-software-install.png:org.gnome.Software.png:gnome-software.png:Gnome-software.png:gnome-software-local-file.png:pamac-manager.png:org.manjaro.pamac.manager.png:pamac-updater.png:update-notifier.png"
          "mother-tauonmb.png:com.github.taiko2k.tauonmusicbox.png:tauonmusicbox.png:tauon-music-box.png:TauonMusicBox.png"
          "mother-terminal.png:utilities-terminal.png:org.gnome.Terminal.png:gnome-terminal.png:terminal.png:Gnome-terminal.png:org.gnome.Console.png:com.gexperts.Tilix.png:konsole.png:org.kde.konsole.png:Konsole.png"
          "mother-thunderbird.png:thunderbird.png:org.mozilla.Thunderbird.png:org.mozilla.thunderbird.png:Thunderbird.png"
          "motherupscayl.png:org.upscayl.Upscayl.png:upscayl.png:upscayl-desktop.png:Upscayl.png:appimagekit-upscayl.png"
          "mother-usebottles.bottles.png:com.usebottles.bottles.png:bottles.png:Bottles.png"
          "mother-vencord.vesktop.png:dev.vencord.Vesktop.png:vesktop.png:Vesktop.png:appimagekit-vesktop.png"
          "mother-viber.png:viber.png:com.viber.Viber.png:Viber.png:viberapp.png"
          "mother-Vim.png:vim.png:gvim.png:Vim.png:Gvim.png:org.vim.Vim.png"
          "mother-vivaldi.vivaldi.png:com.vivaldi.Vivaldi.png:vivaldi.png:vivaldi-stable.png:Vivaldi-stable.png:vivaldi-snapshot.png"
          "mother-warp.png:warp-terminal.png:dev.warp.Warp.png:dev.warp.warp.png:Warp.png:warp.png"
          "mother-wine.png:wine.png:org.winehq.wine.png:Wine.png:wine-winecfg.png:wine-uninstaller.png"
          "mother-winetricks.png:winetricks.png:org.winehq.Winetricks.png:Winetricks.png"
          "mother-yaak.png:yaak.png:app.yaak.Yaak.png:app.yaak.yaak.png:Yaak.png:appimagekit-yaak.png"
          "mother-zededitor.png:zed.png:dev.zed.Zed.png:Zed.png"
          "mother-zenbrowser.png:zen.png:zen-browser.png:io.github.zen_browser.zen.png:Zen.png:appimagekit-zen-browser.png:zen-alpha.png:app.zen_browser.zen.png"
          )

          for entry in "${MAPS[@]}"; do
              IFS=":" read -r -a aliases <<< "$entry"
              master_file="${aliases[0]}"

              for size in "${SIZES[@]}"; do
                  apps_dir="$THEME_DIR/$size/apps"

                  if [ -f "$apps_dir/$master_file" ]; then
                      for ((i=1; i<${#aliases[@]}; i++)); do
                          alias_name="${aliases[i]}"
                          alias_clean="${alias_name//.svg/.png}"
                          # Use a HARD COPY instead of a symlink.
                          # Symlinks break in some browsers, file managers,
                          # and KDE/Plasma lookups when the theme is packaged
                          # as a zip or installed across filesystems.
                          cp -f "$apps_dir/$master_file" "$apps_dir/$alias_clean"
                      done
                  else
                      echo "  !! Missing master for aliases: $apps_dir/$master_file"
                  fi
              done
          done

          echo "=== 4. Building the index.theme ==="
          SCALABLE_DIRS=""
          if [ -d "$THEME_DIR/scalable" ]; then
              for sub in actions places status devices mimetypes categories symbolic; do
                  if [ -d "$THEME_DIR/scalable/$sub" ]; then
                      SCALABLE_DIRS="$SCALABLE_DIRS,scalable/$sub"
                  fi
              done
          fi

          cat > "$THEME_DIR/index.theme" <<THEME_EOF
          [Icon Theme]
          Name=Tulasi
          Comment=Tulasi pixel-art icon theme for Linux
          Inherits=papirus,hicolor,breeze,breeze-dark,Adwaita
          FollowsColorScheme=true
          Directories=16x16/apps,24x24/apps,32x32/apps,48x48/apps,64x64/apps,128x128/apps,256x256/apps,512x512/apps${SCALABLE_DIRS}

          [16x16/apps]
          Size=16
          Type=Fixed
          Context=Applications

          [24x24/apps]
          Size=24
          Type=Fixed
          Context=Applications

          [32x32/apps]
          Size=32
          Type=Fixed
          Context=Applications

          [48x48/apps]
          Size=48
          Type=Fixed
          Context=Applications

          [64x64/apps]
          Size=64
          Type=Fixed
          Context=Applications

          [128x128/apps]
          Size=128
          Type=Fixed
          Context=Applications

          [256x256/apps]
          Size=256
          Type=Fixed
          Context=Applications

          [512x512/apps]
          Size=512
          Type=Fixed
          Context=Applications

          [scalable/actions]
          Size=22
          MinSize=16
          MaxSize=512
          Type=Scalable
          Context=Actions

          [scalable/places]
          Size=22
          MinSize=22
          MaxSize=1024
          Type=Scalable
          Context=Places

          [scalable/status]
          Size=22
          MinSize=16
          MaxSize=512
          Type=Scalable
          Context=Status

          [scalable/devices]
          Size=22
          MinSize=16
          MaxSize=512
          Type=Scalable
          Context=Devices

          [scalable/mimetypes]
          Size=22
          MinSize=16
          MaxSize=512
          Type=Scalable
          Context=MimeTypes

          [scalable/categories]
          Size=22
          MinSize=16
          MaxSize=512
          Type=Scalable
          Context=Categories

          [scalable/symbolic]
          Size=16
          MinSize=16
          MaxSize=31
          Type=Scalable
          Context=Actions
          THEME_EOF

          echo "=== 5. Cleaning ==="
          rm -f "$THEME_DIR/awd"  # The empty file in the source repo (probably accidental)
          rm -f "$THEME_DIR/icon-theme.cache"

          echo "=== Build complete ==="
          SCALE_EOF
          chmod +x build/scale.sh

      - name: Copy source assets into build dir
        run: |
          # Copy cow/ and scalable/ (if it exists) into build/
          # The script writes index.theme itself, so we don't copy the old one
          cp -r cow build/cow
          if [ -d scalable ]; then
            cp -r scalable build/scalable
          fi

      - name: Run build
        run: |
          cd build
          bash scale.sh
          echo ""
          echo "=== Verification: count PNGs in each size folder ==="
          for s in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            count=$(find "$s/apps" -maxdepth 1 -name '*.png' -type f 2>/dev/null | wc -l)
            echo "$s/apps: $count real PNG files"
          done
          echo ""
          echo "=== Sample PNG (firefox) - check it's a real PNG not a symlink ==="
          ls -la 128x128/apps/firefox.png 128x128/apps/mother-firefox.png 2>&1 | head -5
          file 128x128/apps/firefox.png 2>&1 | head -2

      - name: Get version tag
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Package theme
        run: |
          cd build
          # Remove the cow/ source folder from the packaged theme
          rm -rf cow scale.sh
          # The folder name is "build" right now (because that's our THEME_DIR)
          # Rename to Tulasi for the user-facing zip
          cd ..
          mv build Tulasi
          zip -r "Tulasi-${{ steps.version.outputs.version }}.zip" Tulasi
          ls -la "Tulasi-${{ steps.version.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulasi-build
          path: Tulasi-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Tulasi-build
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Tulasi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
