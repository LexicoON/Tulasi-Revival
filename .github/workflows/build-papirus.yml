          "mother-thunderbird.png:thunderbird.png:org.mozilla.Thunderbird.png:org.mozilla.thunderbird.png:Thunderbird.png"
          "motherupscayl.png:org.upscayl.Upscayl.png:upscayl.png:upscayl-desktop.png:Upscayl.png:appimagekit-upscayl.png"
          "mother-usebottles.bottles.png:com.usebottles.bottles.png:bottles.png:Bottles.png"
          "mother-vencord.vesktop.png:dev.vencord.Vesktop.png:vesktop.png:Vesktop.png:appimagekit-vesktop.png"
          "mother-viber.png:viber.png:com.viber.Viber.png:Viber.png:viberapp.png"
          "mother-Vim.png:vim.png:gvim.png:Vim.png:Gvim.png:org.vim.Vim.png"
          "mother-vivaldi.vivaldi.png:com.vivaldi.Vivaldi.png:vivaldi.png:vivaldi-stable.png:Vivaldi-stable.png:vivaldi-snapshot.png"
          "mother-warp.png:warp-terminal.png:dev.warp.Warp.png:dev.warp.warp.png:Warp.png:warp.png"
          "mother-wine.png:wine.png:org.winehq.wine.png:Wine.png:wine-winecfg.png:wine-uninstaller.png"
          "mother-winetricks.png:winetricks.png:org.winehq.Winetricks.png:Winetricks.png"
          "mother-yaak.png:yaak.png:app.yaak.Yaak.png:app.yaak.yaak.png:Yaak.png:appimagekit-yaak.png"
          "mother-zededitor.png:zed.png:dev.zed.Zed.png:Zed.png"
          "mother-zenbrowser.png:zen.png:zen-browser.png:io.github.zen_browser.zen.png:Zen.png:appimagekit-zen-browser.png:zen-alpha.png:app.zen_browser.zen.png"
          )

          for entry in "${MAPS[@]}"; do
              IFS=":" read -r -a aliases <<< "$entry"
              master_file="${aliases[0]}"
              for size in "${SIZES[@]}"; do
                  apps_dir="$THEME_DIR/$size/apps"
                  [ -d "$apps_dir" ] || continue
                  if [ -f "$apps_dir/$master_file" ]; then
                      for ((i=1; i<${#aliases[@]}; i++)); do
                          alias_name="${aliases[i]}"
                          alias_clean="${alias_name//.svg/.png}"
                          [ "$alias_clean" = "$master_file" ] && continue
                          cp -f "$apps_dir/$master_file" "$apps_dir/$alias_clean"
                      done
                  fi
              done
          done

          echo "=== 3b. Place (folder) aliases ==="
          PLACE_MAPS=(
          "folder.png:folder-open.png:inode-directory.png"
          "folder-download.png:folder-downloads.png"
          "user-home.png:user-desktop.png"
          "user-trash.png:user-trash-full.png:trash-empty.png:trash-full.png"
          )

          for entry in "${PLACE_MAPS[@]}"; do
              IFS=":" read -r -a aliases <<< "$entry"
              canonical="${aliases[0]}"
              for size in "${SIZES[@]}"; do
                  places_dir="$THEME_DIR/$size/places"
                  [ -d "$places_dir" ] || continue
                  master_file=""
                  if [ -f "$places_dir/$canonical" ]; then
                      master_file="$canonical"
                  elif [ -f "$places_dir/mother-${canonical}" ]; then
                      master_file="mother-${canonical}"
                  fi
                  [ -n "$master_file" ] || continue
                  for ((i=1; i<${#aliases[@]}; i++)); do
                      alias_name="${aliases[i]}"
                      alias_clean="${alias_name//.svg/.png}"
                      [ "$alias_clean" = "$master_file" ] && continue
                      cp -f "$places_dir/$master_file" "$places_dir/$alias_clean"
                  done
              done
          done

          echo "=== 4. Rendering scalable/* SVGs directly at each density ==="
          if [ -d "$THEME_DIR/scalable" ]; then
              for ctx_dir in "$THEME_DIR"/scalable/*/; do
                  [ -d "$ctx_dir" ] || continue
                  ctx=$(basename "$ctx_dir")
                  if [ "$ctx" = "symbolic" ]; then
                      continue
                  fi
                  for svg in "$ctx_dir"*.svg; do
                      [ -f "$svg" ] || continue
                      base_name=$(basename "$svg" .svg)
                      for size in "${SIZES[@]}"; do
                          dim=$(target_dim "$size")
                          target_dir="$size/$ctx"
                          target_file="$target_dir/$base_name.png"
                          mkdir -p "$target_dir"
                          rsvg-convert -w "$dim" -h "$dim" "$svg" -o "$target_file"
                      done
                  done
              done
          fi

          echo "=== 5. Build complete (Tulasi layer only) ==="
          SCALE_EOF
          chmod +x build/scale.sh

      - name: Copy Tulasi source assets into build dir
        run: |
          cp -r cow build/cow
          if [ -d scalable ]; then
            cp -r scalable build/scalable
          fi

      - name: Run Tulasi build
        run: |
          cd build
          bash scale.sh
          echo ""
          echo "=== Verification: 48x48/apps ==="
          ls 48x48/apps/ | wc -l

      - name: Merge Papirus under Tulasi
        run: |
          cd build

          echo "=== Extracting Papirus alias graph (symlinks) ==="
          # Papirus usa symlinks para crear cientos de aliases.
          # Los registramos ANTES del merge para poder re-expandirlos
          # con el contenido de Tulasi después.
          ALIAS_GRAPH=/tmp/papirus_aliases.txt
          : > "$ALIAS_GRAPH"
          for size_dir in ../papirus/Papirus/*/; do
              [ -d "$size_dir/apps" ] || continue
              size=$(basename "$size_dir")
              for f in "$size_dir"/apps/*.png; do
                  [ -L "$f" ] || continue
                  alias_name=$(basename "$f")
                  target_name=$(basename "$(readlink "$f")")
                  echo "$size/$alias_name:$target_name" >> "$ALIAS_GRAPH"
              done
          done
          echo "Recorded $(wc -l < $ALIAS_GRAPH) alias relationships"

          echo "=== Copying Papirus as base layer (Tulasi wins on collisions) ==="
          rsync -a --ignore-existing ../papirus/Papirus/ .
          if [ -d ../papirus/Papirus-Dark ]; then
              mkdir -p Papirus-Dark
              rsync -a --ignore-existing ../papirus/Papirus-Dark/ Papirus-Dark/
          fi
          if [ -d ../papirus/Papirus-Light ]; then
              mkdir -p Papirus-Light
              rsync -a --ignore-existing ../papirus/Papirus-Light/ Papirus-Light/
          fi

          echo "=== Expanding Papirus aliases using Tulasi content ==="
          # Para cada symlink A -> T de Papirus, hacemos build/A = build/T.
          # Si build/T ya es la versión de Tulasi (porque Tulasi tenía ese
          # nombre), A ahora mostrará el icono de Tulasi.
          while IFS=: read -r alias_path target_name; do
              size=$(dirname "$alias_path")
              alias_name=$(basename "$alias_path")
              if [ -f "$size/apps/$target_name" ]; then
                  cp -f "$size/apps/$target_name" "$size/apps/$alias_name"
              fi
          done < "$ALIAS_GRAPH"
          echo "Done. Aliases expanded."

      - name: Generate merged index.theme
        run: |
          cd build

          echo "=== Discovered directories in merged theme ==="
          ALL_DIRS=""
          for d in $(find . -maxdepth 1 -type d | sed 's|^\./||' | grep -E '^[0-9]+x[0-9]+(@[0-9]+x?)?$' | sort -V); do
              for ctx in apps actions devices mimetypes places status categories emblems emotes panel legacy ui; do
                  if [ -d "$d/$ctx" ]; then
                      ALL_DIRS="$ALL_DIRS,$d/$ctx"
                      count=$(ls "$d/$ctx" 2>/dev/null | wc -l)
                      echo "  $d/$ctx: $count files"
                  fi
              done
          done
          if [ -d scalable ]; then
              for ctx in actions apps categories devices emblems emotes mimetypes places status legacy ui; do
                  if [ -d "scalable/$ctx" ]; then
                      ALL_DIRS="$ALL_DIRS,scalable/$ctx"
                  fi
              done
          fi
          ALL_DIRS="${ALL_DIRS#,}"

          cat > index.theme <<HEADER
          [Icon Theme]
          Name=Tulasi
          Comment=Tulasi pixel art layered on top of Papirus — best of both worlds
          Inherits=hicolor
          FollowsColorScheme=true

          Directories=${ALL_DIRS}
          HEADER

      - name: Append per-directory sections to index.theme
        run: |
          cd build
          for dir in $(grep "^Directories=" index.theme | sed 's/Directories=//' | tr ',' ' '); do
            size_part=$(echo "$dir" | cut -d'/' -f1)
            ctx_part=$(echo "$dir" | cut -d'/' -f2)

            if [[ "$size_part" == "scalable" ]]; then
              cat >> index.theme <<SECTION

          [$dir]
          Size=256
          Type=Scalable
          MinSize=16
          MaxSize=512
          Context=${ctx_part^}
          SECTION
            elif [[ "$size_part" == *"@"* ]]; then
              nominal=$(echo "$size_part" | sed -E 's/([0-9]+)x[0-9]+@.*/\1/')
              scale=$(echo "$size_part" | sed -E 's/.*@([0-9]+)x?/\1/')
              cat >> index.theme <<SECTION

          [$dir]
          Size=${nominal}
          Scale=${scale}
          Type=Scalable
          MinSize=${nominal}
          MaxSize=$((nominal * 4))
          Context=${ctx_part^}
          SECTION
            else
              nominal=$(echo "$size_part" | sed -E 's/([0-9]+)x.*/\1/')
              cat >> index.theme <<SECTION

          [$dir]
          Size=${nominal}
          Type=Fixed
          Context=${ctx_part^}
          SECTION
            fi
          done

      - name: Final cleanup
        run: |
          cd build
          find . -name 'index.theme' ! -path './index.theme' -delete 2>/dev/null || true
          find . -name 'icon-theme.cache' -delete 2>/dev/null || true
          rm -f awd scale.sh .base_sizes
          rm -rf cow

      - name: Get version string
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Package theme
        run: |
          cd build
          cd ..
          mv build Tulasi
          zip -r "Tulasi-${{ steps.version.outputs.version }}.zip" Tulasi
          unzip -l "Tulasi-${{ steps.version.outputs.version }}.zip" | tail -3

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulasi-merged-build
          path: Tulasi-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Tulasi-merged-build
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Tulasi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          body: |
            ## Tulasi + Papirus merged icon theme

            Pixel-art Tulasi icons layered on top of the latest Papirus for full coverage.

            **Install:**
            ```bash
            unzip Tulasi-${{ steps.version.outputs.version }}.zip
            rm -rf ~/.local/share/icons/Tulasi
            mv Tulasi ~/.local/share/icons/Tulasi
            rm -f ~/.cache/icon-cache.kcache
