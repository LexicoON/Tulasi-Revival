          "mother-usebottles.bottles.png:com.usebottles.bottles.png:bottles.png:Bottles.png"
          "mother-vencord.vesktop.png:dev.vencord.Vesktop.png:vesktop.png:Vesktop.png:appimagekit-vesktop.png"
          "mother-viber.png:viber.png:com.viber.Viber.png:Viber.png:viberapp.png"
          "mother-Vim.png:vim.png:gvim.png:Vim.png:Gvim.png:org.vim.Vim.png"
          "mother-vivaldi.vivaldi.png:com.vivaldi.Vivaldi.png:vivaldi.png:vivaldi-stable.png:Vivaldi-stable.png:vivaldi-snapshot.png"
          "mother-warp.png:warp-terminal.png:dev.warp.Warp.png:dev.warp.warp.png:Warp.png:warp.png"
          "mother-wine.png:wine.png:org.winehq.wine.png:Wine.png:wine-winecfg.png:wine-uninstaller.png"
          "mother-winetricks.png:winetricks.png:org.winehq.Winetricks.png:Winetricks.png"
          "mother-yaak.png:yaak.png:app.yaak.Yaak.png:app.yaak.yaak.png:Yaak.png:appimagekit-yaak.png"
          "mother-zededitor.png:zed.png:dev.zed.Zed.png:Zed.png"
          "mother-zenbrowser.png:zen.png:zen-browser.png:io.github.zen_browser.zen.png:Zen.png:appimagekit-zen-browser.png:zen-alpha.png:app.zen_browser.zen.png"
          )

          for entry in "${MAPS[@]}"; do
              IFS=":" read -r -a aliases <<< "$entry"
              master_file="${aliases[0]}"

              for size in "${SIZES[@]}"; do
                  apps_dir="$THEME_DIR/$size/apps"

                  if [ -f "$apps_dir/$master_file" ]; then
                      for ((i=1; i<${#aliases[@]}; i++)); do
                          alias_name="${aliases[i]}"
                          alias_clean="${alias_name//.svg/.png}"
                          cp -f "$apps_dir/$master_file" "$apps_dir/$alias_clean"
                      done
                  fi
              done
          done

          echo "=== 4. Build complete (Tulasi layer only) ==="
          SCALE_EOF
          chmod +x build/scale.sh

      - name: Copy Tulasi source assets into build dir
        run: |
          cp -r cow build/cow
          if [ -d scalable ]; then
            cp -r scalable build/scalable
          fi

      - name: Run Tulasi build
        run: |
          cd build
          bash scale.sh
          echo ""
          echo "=== Verification: Tulasi PNGs in 48x48/apps ==="
          ls 48x48/apps/ | wc -l

      - name: Merge Papirus under Tulasi
        run: |
          cd build

          echo "=== Copying Papirus as the base layer ==="
          # Copy Papirus's main theme into build/
          # Use /. trick to copy CONTENTS, not the directory itself
          cp -r ../papirus/Papirus/. .
          cp -r ../papirus/Papirus-Dark/. Papirus-Dark/ 2>/dev/null || true
          cp -r ../papirus/Papirus-Light/. Papirus-Light/ 2>/dev/null || true

          echo "=== Overlaying Tulasi PNGs on top (Tulasi wins) ==="
          # For each size, copy Tulasi's apps/ contents ON TOP of Papirus's apps/.
          # cp -f forces overwrite, so Tulasi's files replace any Papirus file
          # with the same name. Anything Tulasi doesn't have, Papirus's version stays.
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            if [ -d "$size/apps" ]; then
              # Count before
              before=$(find "$size/apps" -type f -o -type l | wc -l)
              # Copy Tulasi files over the top with -f to force overwrite
              cp -rf "$size/apps/." "$size/apps/"
              after=$(find "$size/apps" -type f -o -type l | wc -l)
              echo "  $size/apps: $before -> $after files (Tulasi overlay applied)"
            fi
          done

          # If Tulasi has a scalable/ folder, overlay it too
          # (Papirus doesn't use scalable/ by default, but just in case)
          if [ -d scalable ]; then
            for sub in scalable/*/; do
              [ -d "$sub" ] || continue
              cp -rf "$sub." "$sub"
              echo "  $sub: Tulasi overlay applied"
            done
          fi

      - name: Generate merged index.theme
        run: |
          cd build

          # Discover every directory in the merged theme
          echo "=== Discovered directories in merged theme ==="
          ALL_DIRS=""
          for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
            for ctx in apps actions devices mimetypes places status categories emblems emotes panel; do
              if [ -d "$size/$ctx" ]; then
                ALL_DIRS="$ALL_DIRS,$size/$ctx"
                count=$(ls "$size/$ctx" 2>/dev/null | wc -l)
                echo "  $size/$ctx: $count files"
              fi
            done
          done

          # @2x scaled directories (Papirus convention for HiDPI)
          for size in 16x16 22x22 24x24 32x32 48x48 64x64; do
            if [ -d "${size}@2x" ]; then
              for ctx in apps actions devices mimetypes places status categories; do
                if [ -d "${size}@2x/$ctx" ]; then
                  ALL_DIRS="$ALL_DIRS,${size}@2x/$ctx"
                fi
              done
            fi
          done

          # Non-standard sizes (Papirus uses 8x8, 18x18, 22x22, 42x42, 84x84, 96x96)
          for size in 8x8 18x18 22x22 42x42 84x84 96x96; do
            for ctx in apps actions devices mimetypes places status emblems; do
              if [ -d "$size/$ctx" ]; then
                ALL_DIRS="$ALL_DIRS,$size/$ctx"
              fi
            done
          done

          # Strip leading comma
          ALL_DIRS="${ALL_DIRS#,}"

          # Write the merged index.theme
          cat > index.theme <<HEADER
          [Icon Theme]
          Name=Tulasi
          Comment=Tulasi pixel art layered on top of Papirus — best of both worlds
          Inherits=hicolor
          FollowsColorScheme=true

          DesktopDefault=48
          DesktopSizes=16,22,24,32,48,64
          ToolbarDefault=22
          ToolbarSizes=16,22,24,32,48
          MainToolbarDefault=22
          MainToolbarSizes=16,22,24,32,48
          SmallDefault=16
          SmallSizes=16,22,24,32,48
          PanelDefault=48
          PanelSizes=16,22,24,32,48,64
          DialogDefault=48
          DialogSizes=16,22,24,32,48,64

          Directories=${ALL_DIRS}
          HEADER

          echo ""
          echo "=== Generated index.theme header ==="
          head -20 index.theme

      - name: Append per-directory sections to index.theme
        run: |
          cd build
          # For each directory in Directories, append a [section] with Size, Type, Context
          # This is what icon loaders actually need to do proper lookups
          for dir in $(grep "^Directories=" index.theme | sed 's/Directories=//' | tr ',' ' '); do
            # Extract size (e.g., 48 from 48x48/apps) and context (e.g., apps)
            size_part=$(echo "$dir" | cut -d'/' -f1)
            ctx_part=$(echo "$dir" | cut -d'/' -f2)

            # Numeric size: 48x48 -> 48, 16x16@2x -> 16 (nominal, not actual)
            if [[ "$size_part" == *"@"* ]]; then
              nominal=$(echo "$size_part" | sed -E 's/([0-9]+)x[0-9]+@.*/\1/')
              actual=$(echo "$size_part" | sed -E 's/.*@([0-9]+)x?/\1/')
              # Convert to integer for the @2x scale
              scale=$(echo "$size_part" | sed -E 's/.*@([0-9]+)x?/\1/')
              cat >> index.theme <<SECTION

          [$dir]
          Size=${nominal}
          Scale=${scale}
          Type=Scalable
          MinSize=${nominal}
          MaxSize=$((nominal * 4))
          Context=${ctx_part^}
          SECTION
            else
              nominal=$(echo "$size_part" | sed -E 's/([0-9]+)x.*/\1/')
              cat >> index.theme <<SECTION

          [$dir]
          Size=${nominal}
          Type=Fixed
          Context=${ctx_part^}
          SECTION
            fi
          done

          echo "=== Final index.theme ==="
          cat index.theme

      - name: Final cleanup
        run: |
          cd build
          # Strip Papirus's own index.theme (we have our own merged one)
          find . -name 'index.theme' ! -path './index.theme' -delete 2>/dev/null || true
          # Strip any leftover Papirus cache files
          find . -name 'icon-theme.cache' -delete 2>/dev/null || true
          # Remove the empty awd file from the original Tulasi repo
          rm -f awd
          # Remove our own build scripts
          rm -f scale.sh
          # Remove the cow source folder (not needed in the shipped theme)
          rm -rf cow

      - name: Get version string
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "version=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi
          echo "Build version: ${{ steps.version.outputs.version }}"

      - name: Package theme (single zip, no double-wrap)
        run: |
          cd build
          # Rename the build dir to Tulasi for the final shipped name
          cd ..
          mv build Tulasi

          # Create the zip directly (no nested directory inside)
          zip -r "Tulasi-${{ steps.version.outputs.version }}.zip" Tulasi

          echo ""
          echo "=== Zip contents (first 20) ==="
          unzip -l "Tulasi-${{ steps.version.outputs.version }}.zip" | head -25
          echo ""
          echo "=== Total entries ==="
          unzip -l "Tulasi-${{ steps.version.outputs.version }}.zip" | tail -3

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulasi-merged-build
          path: Tulasi-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Tulasi-merged-build
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Tulasi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          body: |
            ## Tulasi + Papirus merged icon theme

            Pixel-art Tulasi icons for 100+ apps, layered on top of the latest Papirus
            for full coverage of everything else.

            **Install:**
            ```bash
            unzip Tulasi-${{ steps.version.outputs.version }}.zip
            mv Tulasi ~/.local/share/icons/Tulasi
            gtk-update-icon-cache -f -t ~/.local/share/icons/Tulasi
            rm -f ~/.cache/icon-cache.kcache
            kquitapp6 plasmashell && kstart plasmashell  # KDE only
            ```
