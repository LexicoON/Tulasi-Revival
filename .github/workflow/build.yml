name: Build Tulasi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Prepare build directory
        run: |
          mkdir -p build
          cp -r cow build/
          cp index.theme build/
          cp scale.sh build/
          # Patch THEME_DIR in scale.sh to point to our build dir
          sed -i 's|/home/nuclear/Documents/Arpana|$GITHUB_WORKSPACE/build|g' build/scale.sh
          chmod +x build/scale.sh

      - name: Run build script
        run: cd build && bash scale.sh

      - name: Strip hardcoded cache path
        run: |
          # The last line of scale.sh tries to refresh an Arpana cache that doesn't exist here
          # Override it to refresh the Tulasi cache we just built
          gtk-update-icon-cache -f -t build/ || true

      - name: Package build artifact
        run: |
          cd build
          # Remove the cow/ source from the packaged theme
          rm -rf cow scale.sh
          # Zip it
          mv "$(ls -d */ | head -1)" Tulasi 2>/dev/null || true
          # The folder name should already be correct since we copied THEME_DIR structure
          zip -r ../Tulasi-build.zip . -x "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulasi-build
          path: Tulasi-build.zip
